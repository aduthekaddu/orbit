services:
  orbit:
    build: .
    # The entrypoint starts as root to give ./data to uid 1000, then drops to node.
    user: "0:0"
    ports:
      - "127.0.0.1:3210:3210"
    volumes:
      - ./data:/app/data
    environment:
      BETTER_AUTH_URL: http://127.0.0.1:3210
      ORBIT_PUBLIC_URL: ${ORBIT_PUBLIC_URL:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      ORBIT_BASE_URL: ${ORBIT_BASE_URL:-}
      ORBIT_API_KEY: ${ORBIT_API_KEY:-}
      ORBIT_MODEL: ${ORBIT_MODEL:-}
      ORBIT_SEARXNG_URL: ${ORBIT_SEARXNG_URL:-http://searxng:8080}
      ORBIT_TAVILY_API_KEY: ${ORBIT_TAVILY_API_KEY:-}
      ORBIT_OLLAMA_URL: ${ORBIT_OLLAMA_URL:-http://host.docker.internal:11434}
      ORBIT_DREAM_HOUR: ${ORBIT_DREAM_HOUR:-3}
      TZ: ${TZ:-UTC}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["npm", "start", "--", "-p", "3210", "-H", "0.0.0.0"]
    restart: "no"

  searxng:
    image: searxng/searxng@sha256:892ed5710603e38f9dc201e6a0b2f3f14dbdb8108edcadac30e55b165c979fb7
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'export SEARXNG_SECRET="$$(python -c "import secrets; print(secrets.token_hex(32))")"; exec /usr/local/searxng/entrypoint.sh'
    restart: "no"

  # Runs only with --profile public. It reaches Orbit as http://orbit:3210 on the Compose network.
  cloudflared:
    image: cloudflare/cloudflared@sha256:4955524aeaa379e154023d5a027c250f7b35041a2e7e950cf13f144bc9b9c5ba
    profiles: [public]
    # A file secret keeps the token out of the container's environment and out of docker compose config.
    command: ["tunnel", "--no-autoupdate", "run", "--token-file", "/run/secrets/cloudflare_tunnel_token"]
    secrets:
      - cloudflare_tunnel_token
    depends_on:
      - orbit
    restart: "no"

secrets:
  cloudflare_tunnel_token:
    environment: CLOUDFLARE_TUNNEL_TOKEN
