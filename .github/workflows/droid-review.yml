# factory-automation: bcb40560-93c5-4b5f-af4c-33667566ab06
name: Droid Code Review
"on":
  workflow_dispatch: {}
  pull_request:
    types:
      - opened
      - synchronize
      - ready_for_review
permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run Factory droid-action
        uses: Factory-AI/droid-action@main
        with:
          factory_api_key: ${{ secrets.FACTORY_API_KEY }}
          automatic_review: true
          automatic_security_review: true
          review_depth: deep
          review_model: gpt-6.2-sol
          reasoning_effort: high
