name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    name: Secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks over the full history
        run: |
          docker run --rm --volume "$PWD:/repo:ro" \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            detect --source /repo --config /repo/.gitleaks.toml --redact --no-banner --verbose

  dependencies:
    name: Dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Find new vulnerabilities in a pull request
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          mkdir "$RUNNER_TEMP/base"
          git show "origin/$BASE_REF:package-lock.json" > "$RUNNER_TEMP/base/package-lock.json"
          scripts/ci/osv-gate.sh "$RUNNER_TEMP/base/package-lock.json"
      - name: Find vulnerabilities in production dependencies
        if: github.event_name != 'pull_request'
        run: scripts/ci/osv-gate.sh

  semgrep:
    name: Semgrep
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan the source
        # The Dockerfile runs as root. Remove the exclusion when the image runs as a non-root user.
        run: |
          docker run --rm --volume "$PWD:/src" --workdir /src \
            --env SEMGREP_SEND_METRICS=off \
            --env GIT_CONFIG_COUNT=1 --env GIT_CONFIG_KEY_0=safe.directory --env GIT_CONFIG_VALUE_0=/src \
            semgrep/semgrep@sha256:cc1b68266f267878b39739373ea9985b9a78e5d64497dd875c8de100b22695ed \
            semgrep scan --metrics=off --error --quiet \
            --exclude-rule dockerfile.security.missing-user.missing-user \
            --config p/typescript --config p/javascript --config p/react --config p/nextjs \
            --config p/security-audit --config p/owasp-top-ten --config p/secrets \
            --config p/dockerfile --config p/docker-compose \
            .

  security:
    name: Security passed
    if: always()
    needs: [secrets, dependencies, semgrep]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every job to pass
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: echo "$NEEDS" | jq --exit-status 'all(.[]; .result == "success")'
