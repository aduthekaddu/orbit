name: Set up Orbit
description: Install Node.js and the locked dependencies, and optionally build the app.
inputs:
  node-version:
    description: Node.js major version.
    default: "22"
  build:
    description: Run `npm run build` after the install.
    default: "false"
outputs:
  cache-key:
    description: Exact cache key for the locked node_modules tree.
    value: ${{ steps.key.outputs.key }}
  cache-state:
    description: Outcome of dependency cache restoration (hit, miss, restore-error, invalid-restore, or key-error).
    value: ${{ steps.verify.outputs.state }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      id: node
      with:
        node-version: ${{ inputs.node-version }}
        package-manager-cache: false
    - name: Compute the dependency cache key
      id: key
      continue-on-error: true
      shell: bash
      env:
        RUNNER_OS: ${{ runner.os }}
        RUNNER_ARCH: ${{ runner.arch }}
        NODE_VERSION: ${{ steps.node.outputs.node-version }}
        LOCK_HASH: ${{ hashFiles('package.json', 'package-lock.json', '.npmrc', '.github/actions/setup-orbit/action.yml') }}
      run: |
        set -euo pipefail
        ID=""
        VERSION_ID=""
        # shellcheck source=/dev/null
        . /etc/os-release
        libc=$(getconf GNU_LIBC_VERSION)
        libc=${libc// /-}
        node_target=$(node -p 'process.platform + "-" + process.arch')
        node_abi=$(node -p 'process.versions.modules')
        for value in "$RUNNER_OS" "$RUNNER_ARCH" "$ID" "$VERSION_ID" "$libc" "$node_target" "$node_abi" "$NODE_VERSION" "$LOCK_HASH"; do
          if [[ -z "$value" ]]; then
            echo "Missing dependency cache key component." >&2
            exit 1
          fi
        done
        printf 'key=orbit-modules-%s-%s-%s-%s-%s-%s-abi%s-%s-%s\n' \
          "$RUNNER_OS" "$RUNNER_ARCH" "$ID" "$VERSION_ID" "$libc" "$node_target" "$node_abi" "$NODE_VERSION" "$LOCK_HASH" >> "$GITHUB_OUTPUT"
    - name: Restore locked node_modules
      if: steps.key.outcome == 'success' && steps.key.outputs.key != ''
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: modules
      continue-on-error: true
      with:
        path: node_modules
        key: ${{ steps.key.outputs.key }}
    - name: Verify restored node_modules
      id: verify
      shell: bash
      env:
        KEY_OUTCOME: ${{ steps.key.outcome }}
        CACHE_KEY: ${{ steps.key.outputs.key }}
        RESTORE_OUTCOME: ${{ steps.modules.outcome }}
        CACHE_HIT: ${{ steps.modules.outputs.cache-hit }}
      run: |
        set -euo pipefail
        if [[ "$KEY_OUTCOME" != "success" || -z "$CACHE_KEY" ]]; then
          echo "::warning::Dependency cache key could not be computed; falling back to clean npm ci."
          printf 'state=key-error\n' >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if [[ "$RESTORE_OUTCOME" != "success" ]]; then
          echo "::warning::Dependency cache restore failed; falling back to clean npm ci."
          printf 'state=restore-error\n' >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if [[ "$CACHE_HIT" != "true" ]]; then
          printf 'state=miss\n' >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if test -d node_modules &&
          test -s node_modules/.package-lock.json &&
          test -x node_modules/.bin/tsc &&
          test -x node_modules/.bin/next &&
          test -x node_modules/.bin/tsx &&
          test -x node_modules/.bin/playwright &&
          node_modules/.bin/tsrs --version > /dev/null &&
          node --input-type=commonjs -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const root = process.cwd();
            const modulesDir = path.join(root, "node_modules") + path.sep;
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const locked = JSON.parse(fs.readFileSync("package-lock.json", "utf8")).packages;
            const hidden = JSON.parse(fs.readFileSync("node_modules/.package-lock.json", "utf8"));
            if (!hidden || typeof hidden.packages !== "object" || Object.keys(hidden.packages).length === 0) {
              throw new Error("Incomplete hidden lockfile");
            }
            for (const section of ["dependencies", "devDependencies"]) {
              for (const name of Object.keys(pkg[section] ?? {})) {
                const key = "node_modules/" + name;
                const installed = JSON.parse(fs.readFileSync(path.join(key, "package.json"), "utf8"));
                if (!installed.version || installed.version !== locked[key]?.version) {
                  throw new Error("Installed package does not match the lockfile: " + name);
                }
              }
            }
            const sqlitePath = require.resolve("better-sqlite3", { paths: [root] });
            const vecPath = require.resolve("sqlite-vec", { paths: [root] });
            if (!sqlitePath.startsWith(modulesDir) || !vecPath.startsWith(modulesDir)) {
              throw new Error("Native modules resolved outside workspace node_modules");
            }
            const Database = require(sqlitePath);
            const sqliteVec = require(vecPath);
            const db = new Database(":memory:");
            try {
              sqliteVec.load(db);
              db.prepare("select vec_version()").get();
            } finally {
              db.close();
            }
          '; then
          printf 'state=hit\n' >> "$GITHUB_OUTPUT"
        else
          echo "::warning::Restored node_modules failed verification; falling back to clean npm ci."
          printf 'state=invalid-restore\n' >> "$GITHUB_OUTPUT"
        fi
    - name: Install dependencies
      if: steps.verify.outputs.state != 'hit'
      shell: bash
      run: |
        set -euo pipefail
        if [[ -d node_modules && ! -L node_modules ]]; then
          chmod -R u+w node_modules 2>/dev/null || true
        fi
        rm -rf node_modules
        npm ci
    - name: Build
      if: inputs.build == 'true'
      shell: bash
      run: npm run build
