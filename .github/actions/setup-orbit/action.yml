name: Set up Orbit
description: Install Node.js and the locked dependencies, and optionally build the app.
inputs:
  node-version:
    description: Node.js major version.
    default: "22"
  build:
    description: Run `npm run build` after the install.
    default: "false"
  seed-dependency-cache:
    description: Allow this job to save the installed dependency tree.
    default: "false"
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      id: node
      with:
        node-version: ${{ inputs.node-version }}
        package-manager-cache: false
    - name: Identify the native dependency platform
      id: platform
      shell: bash
      run: |
        . /etc/os-release
        libc=$(getconf GNU_LIBC_VERSION)
        printf 'key=%s-%s-%s\n' "$ID" "$VERSION_ID" "${libc// /-}" >> "$GITHUB_OUTPUT"
    - name: Restore locked node_modules
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: modules
      with:
        path: node_modules
        key: orbit-modules-${{ runner.os }}-${{ runner.arch }}-${{ steps.platform.outputs.key }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('package.json', 'package-lock.json', '.npmrc', '.github/actions/setup-orbit/action.yml') }}
    - name: Install dependencies
      if: steps.modules.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci
    - name: Seed locked node_modules
      if: >-
        inputs.seed-dependency-cache == 'true' &&
        steps.modules.outputs.cache-hit != 'true' &&
        (github.ref == 'refs/heads/main' ||
        (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: node_modules
        key: ${{ steps.modules.outputs.cache-primary-key }}
    - name: Build
      if: inputs.build == 'true'
      shell: bash
      run: npm run build
