version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      ai-sdk:
        patterns: ["ai", "@ai-sdk/*"]
      assistant-ui:
        patterns: ["@assistant-ui/*"]
      radix-ui:
        patterns: ["@radix-ui/*"]
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      - dependency-name: "@types/node"
        versions: [">=23"]

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(docker)"
    ignore:
      - dependency-name: node
        versions: [">=23"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(docker)"
